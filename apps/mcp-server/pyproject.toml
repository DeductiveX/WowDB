[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wowdb-mcp-server"
version = "0.1.0"
description = "WowDB MCP server — exposes database schema tools to Claude, Cursor and other MCP clients"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
]

[project.scripts]
wowdb-mcp = "wowdb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["wowdb_mcp"]
